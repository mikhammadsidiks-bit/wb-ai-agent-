name: WB AutoReply

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: auto_reply
        run: pip install -r requirements.txt
      - name: Reply to new reviews
        working-directory: auto_reply
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          START_DATE: ${{ vars.START_DATE }}
        run: python main.py
