name: WB AutoReply

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-auto-reply
  cancel-in-progress: false

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: auto_reply
        run: pip install -r requirements.txt
      - name: Reply to unanswered reviews in all connected stores
        working-directory: auto_reply
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WB_STORE_NAME: "Магазин 1"
          WB_API_TOKEN_2: ${{ secrets.WB_API_TOKEN_2 }}
          WB_STORE_NAME_2: "Магазин 2"
          WB_API_TOKEN_3: ${{ secrets.WB_API_TOKEN_3 }}
          WB_STORE_NAME_3: "Магазин 3"
          REVIEW_LOOKBACK_DAYS: "100"
        run: python main.py
